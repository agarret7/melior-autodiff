name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  MLIR_SYS_230_PREFIX: /usr/lib/llvm-23
  TABLEGEN_230_PREFIX: /usr/lib/llvm-23
  LIBCLANG_PATH: /usr/lib/llvm-23/lib
  # Built and cached below, so the crate doesn't rebuild Enzyme on every run.
  ENZYME_BUILD_DIR: ${{ github.workspace }}/enzyme/build

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install LLVM and MLIR 23
        run: |
          wget -q https://apt.llvm.org/llvm.sh
          sudo bash llvm.sh 23
          # libpolly-23-dev, zlib, zstd, libxml2 and z3: the static LLVM libraries the tblgen
          # crate links (`llvm-config --link-static --libs --system-libs`).
          sudo apt-get install -y libmlir-23-dev mlir-23-tools libclang-23-dev libpolly-23-dev \
            zlib1g-dev libzstd-dev libxml2-dev libz3-dev ninja-build

      # Enzyme only needs rebuilding when the submodule moves.
      - name: Get the Enzyme commit
        id: enzyme
        run: echo "commit=$(git rev-parse HEAD:enzyme)" >> "$GITHUB_OUTPUT"

      - name: Restore the Enzyme build
        id: enzyme-cache
        uses: actions/cache/restore@v4
        with:
          path: enzyme/build
          key: enzyme-llvm23-${{ steps.enzyme.outputs.commit }}

      - name: Build Enzyme's MLIR C API
        if: steps.enzyme-cache.outputs.cache-hit != 'true'
        run: |
          cmake -G Ninja -S enzyme/enzyme -B enzyme/build \
            -DLLVM_DIR=/usr/lib/llvm-23/lib/cmake/llvm \
            -DENZYME_MLIR=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang-23 -DCMAKE_CXX_COMPILER=clang++-23
          cmake --build enzyme/build --target MLIRCAPIEnzyme MLIRLLVMExt --parallel 4

      # Saved straight away, so a failure in a later step doesn't throw the build away.
      - name: Save the Enzyme build
        if: steps.enzyme-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: enzyme/build
          key: enzyme-llvm23-${{ steps.enzyme.outputs.commit }}

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --all-targets

      - name: Doctests
        run: cargo test --doc

      - name: Examples
        run: for example in activities gradients jvp vjp expression; do cargo run --example "$example"; done
