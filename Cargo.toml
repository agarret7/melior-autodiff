[workspace]
resolver = "3"

[package]
name = "melior-autodiff"
version = "0.0.1"
edition = "2021"
description = "Automatic differentiation as a Melior pass"
license = "Apache-2.0"
repository = "https://github.com/agarret7/melior-autodiff"
readme = "README.md"
keywords = ["mlir", "autodiff", "enzyme", "compiler", "melior"]
categories = ["api-bindings", "compilers", "mathematics"]
rust-version = "1.98"
# Enzyme's static libraries may be linked only once per build.
links = "MLIRCAPIEnzyme"

[dependencies]
melior = { git = "https://github.com/mlir-rs/melior", branch = "main", features = ["ods-dialects"] }
mlir-sys = "230.0.1"

[build-dependencies]
bindgen = "0.73"

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }

[[bench]]
name = "gradient"
harness = false
